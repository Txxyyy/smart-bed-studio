name: smart_mattress_viewer
description: Offline smart mattress viewer with typed Flutter state and animation APIs.
version: 1.1.0
publish_to: none
environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.13.0'
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: '>=4.4.4 <5.0.0'
dev_dependencies:
  webview_flutter_platform_interface: ">=2.10.0 <3.0.0"
  flutter_test:
    sdk: flutter
flutter:
  assets:
    - assets/mattress.html
    - assets/manifest.json
    - assets/models/
    - assets/fallback/t11-plus/
    - assets/fallback/t12/
    - assets/fallback/generic/
